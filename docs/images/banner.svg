<text x="62" y="187" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#153c2b">Semester Desk</text>
<text x="66" y="245" font-size="28" fill="#355c49">Your semester, on your terms.</text>
<text x="66" y="297" font-size="18" fill="#587365">Plan your week. Understand your notes.</text><text x="66" y="325" font-size="18" fill="#587365">Keep your work with you — even offline.</text>
