name: Bug report
description: Report a reproducible problem using a synthetic example.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach API keys, sign-in material, private notes or complete personal backups. Use Security for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: App version and platform
      placeholder: "3.0.0 — Chrome / Android version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected tool and a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe screenshots or error text
      description: Remove personal information before uploading.
